<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <main>

        <div class="time-container">
            <div class="time-container-div">
                <span class="date"></span>
                <span class="time"></span>
            </div>
            <div class="time-container-div">
                <span class="city"></span>
                <span class="temperature"></span>
            </div>
            <div class="time-container-div">
                <span class="weather"></span>
                <span class="humidity"></span>
            </div>
        </div>

        <div class="feature-container">
            <div class="feature-div todo"><a href="task.html"><img src="./tasks.jpg" alt=""></a></div>
            <div class="feature-div daily-planner"> <a href="dailyPlanner.html"><img src="./daily planner.jpg" alt=""></a></div>
            <div class="feature-div quotes"><a href="quote.html"><img src="./quotes.jpg" alt=""></a></div>
            <div class="feature-div pomodoro"><a href="timer.html"><img src="./timer.jpg" alt=""></a></div>
            <div class="feature-div goals"><a href="goals.html"><img src="./goals.jpg" alt=""></a></div>
        </div>
        
    </main>
    

    <script src="script.js"></script>
</body>
</html>
